<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessibles · Accessibility tools for any website</title>
<meta name="description" content="Accessibles adds an accessibility panel to any website with one script tag. Text, color, reading, voice and navigation tools, plus automatic fixes.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&family=Rubik:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #fbf8f4;
    --text: #1f1a17;
    --muted: #6b625c;
    --line: #e7dfd7;
    --surface: #f3ede6;
    --brand: #7b3f00;
    --brand-ink: #ffffff;
    --brand-tint: #f2e6da;
    --font-h: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-b: 'Rubik', system-ui, sans-serif;
    --font-m: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --radius: 10px;
    --wrap: 1040px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 17px/1.65 var(--font-b); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img, svg { display: block; }
  ::selection { background: var(--brand); color: var(--brand-ink); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

  .wrap { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
  @media (max-width: 600px) { .wrap { padding: 0 16px; } }

  .top { border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 68px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font: 800 20px/1 var(--font-h); letter-spacing: -.01em; text-decoration: none; }
  .brand img { width: 30px; height: 30px; }
  .nav { display: flex; align-items: center; gap: 28px; }
  .nav a { color: var(--muted); text-decoration: none; font-size: 15px; }
  .nav a:hover { color: var(--text); }
  .gh { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; color: var(--text) !important; }
  .gh:hover { background: var(--surface); }
  .gh svg { width: 18px; height: 18px; fill: currentColor; }
  @media (max-width: 600px) { .nav { gap: 18px; } .nav .link { display: none; } }

  section { padding: 96px 0; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: 0; padding-bottom: 120px; }
  @media (max-width: 600px) { section { padding: 64px 0; } }

  h1, h2, h3 { font-family: var(--font-h); letter-spacing: -.02em; margin: 0; }
  h1 { font-size: clamp(40px, 6.4vw, 68px); line-height: 1.04; font-weight: 800; max-width: 15ch; }
  h2 { font-size: clamp(30px, 4vw, 42px); line-height: 1.1; font-weight: 800; }
  h3 { font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0; }
  .eyebrow { color: var(--brand); font-size: 14px; font-weight: 500; margin-bottom: 20px; }
  .lead { font-size: 20px; line-height: 1.6; color: var(--muted); max-width: 58ch; margin-top: 28px; }
  .intro { color: var(--muted); max-width: 60ch; margin-top: 16px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: var(--radius); border: 1px solid transparent; font: 500 16px/1 var(--font-b); text-decoration: none; cursor: pointer; }
  .btn-main { background: var(--brand); color: var(--brand-ink); }
  .btn-main:hover { background: #6a3600; }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn-ghost:hover { background: var(--surface); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }

  .groups { list-style: none; padding: 0; margin: 72px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .groups li { padding: 22px 24px 22px 0; border-bottom: 1px solid var(--line); }
  .groups b { display: block; font: 600 17px/1.3 var(--font-h); margin-bottom: 4px; }
  .groups span { color: var(--muted); font-size: 15px; line-height: 1.5; }
  @media (max-width: 760px) { .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .groups { grid-template-columns: 1fr; } }

  .steps { list-style: none; counter-reset: step; padding: 0; margin: 48px 0 0; display: grid; gap: 40px; }
  .steps > li { counter-increment: step; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 16px; }
  .steps > li::before { content: counter(step); width: 32px; height: 32px; border-radius: 50%; background: var(--brand-tint); color: var(--brand); display: grid; place-items: center; font: 600 15px/1 var(--font-h); }
  .steps p { color: var(--muted); margin-top: 6px; }
  p code, td code { font: 500 .88em/1.4 var(--font-m); color: var(--brand); }
